name: Version A - Build + Upload + ASG Refresh
on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Build (Maven)
      run: mvn -B -DskipTests package

    - name: Configure AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v5
      with:
        role-to-assume: arn:aws:iam::290752673375:role/GitHubActions-Schedemy-Deploy
        aws-region: eu-central-1
      # OIDC requires id-token: write. [web:279]

    - name: Upload jar to S3
      run: |
        set -euo pipefail
        JAR="$(ls -t target/*.jar | head -n 1)"
        aws s3 cp "$JAR" "s3://htu-schedemy-artifacts-ayoub/releases/app.jar"

    - name: Start ASG instance refresh
      run: |
        aws autoscaling start-instance-refresh --auto-scaling-group-name "schedemy-asg"
